<svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="594mm" viewBox="0 0 1682 1188">
  <defs>
    <style>
      .title { font-family: "Charter", "Georgia", serif; font-weight: 700; fill: #172234; }
      .sans { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #172234; }
      .section { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 1.4px; fill: #172234; }
      .eyebrow { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2.2px; fill: #B58A3A; }
      .body { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 17px; fill: #172234; }
      .body-bold { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #172234; }
      .small { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #4D5561; }
      .small-bold { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #172234; }
      .foot { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 17px; fill: #4D5561; }
      .micro { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #686A69; }
      .blue { fill: #2F6F89; }
      .coral { fill: #B64A3E; }
      .blue-stroke { stroke: #2F6F89; }
      .coral-stroke { stroke: #B64A3E; }
      .ink-stroke { stroke: #172234; }
      .stone-stroke { stroke: #B8B4AB; }
    </style>
    <marker id="arrowStone" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9C998F"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#172234" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1682" height="1188" fill="#F3EFE6"/>
  <rect x="0" y="0" width="14" height="1188" fill="#172234"/>

  <!-- Header -->
  <text x="56" y="42" class="eyebrow">LEGAL RAG · EVIDENCE-SHAPE ANALYSIS</text>
  <text x="1626" y="42" class="sans" font-size="13" text-anchor="end" fill="#686A69">[AUTHOR NAME] · UNIVERSITY OF TRIER · STUDENT ID [000000]</text>
  <text x="56" y="101" class="title" font-size="48">Correct Answers, Uneven Grounding</text>
  <text x="59" y="142" class="sans" font-size="20" font-weight="600" fill="#555B63">THE DISTRIBUTED-EVIDENCE GAP IN LEGAL RAG</text>

  <line x1="938" y1="62" x2="938" y2="174" stroke="#C8C3B9" stroke-width="2"/>
  <circle cx="976" cy="78" r="9" fill="#2F6F89"/>
  <text x="998" y="87" class="sans" font-size="24" font-weight="700" fill="#2F6F89">Answers stay level.</text>
  <path d="M967 116 l10 -10 l10 10 l-10 10 Z" fill="#B64A3E"/>
  <text x="998" y="124" class="sans" font-size="24" font-weight="700" fill="#B64A3E">Grounding falls when</text>
  <text x="998" y="151" class="sans" font-size="24" font-weight="700" fill="#B64A3E">evidence spans pages.</text>
  <text x="976" y="177" class="small">Similar answer quality does not guarantee complete source support.</text>
  <line x1="56" y1="194" x2="1626" y2="194" stroke="#172234" stroke-width="2"/>

  <!-- Left study column -->
  <text x="56" y="237" class="section">1  HYPOTHESIS</text>
  <line x1="56" y1="251" x2="402" y2="251" stroke="#B58A3A" stroke-width="3"/>
  <text x="56" y="285" class="small-bold" letter-spacing="1">RESEARCH QUESTION</text>
  <text x="56" y="316" class="body">
    <tspan x="56" dy="0">How does distributed evidence affect</tspan>
    <tspan x="56" dy="25">the relationship between answer quality</tspan>
    <tspan x="56" dy="25">and source grounding in a legal RAG</tspan>
    <tspan x="56" dy="25">pipeline?</tspan>
  </text>
  <text x="56" y="429" class="small-bold" letter-spacing="1">H1</text>
  <text x="56" y="458" class="body">
    <tspan x="56" dy="0">Multi-page questions will retain</tspan>
    <tspan x="56" dy="25">comparable answer scores but show lower</tspan>
    <tspan x="56" dy="25">final page grounding; uniform citation</tspan>
    <tspan x="56" dy="25">narrowing may widen the gap.</tspan>
  </text>

  <text x="56" y="579" class="small-bold" letter-spacing="1">EVIDENCE-SHAPE COHORT</text>
  <line x1="76" y1="623" x2="342" y2="623" stroke="#CAC5BB" stroke-width="3"/>
  <circle cx="122" cy="623" r="22" fill="#2F6F89"/>
  <path d="M286 600 l23 23 l-23 23 l-23 -23 Z" fill="#B64A3E"/>
  <text x="122" y="629" class="sans" font-size="16" font-weight="700" fill="#F3EFE6" text-anchor="middle">59</text>
  <text x="286" y="629" class="sans" font-size="16" font-weight="700" fill="#F3EFE6" text-anchor="middle">36</text>
  <text x="122" y="667" class="small-bold" text-anchor="middle">LOCALIZED</text>
  <text x="122" y="687" class="small" text-anchor="middle">one gold page</text>
  <text x="286" y="667" class="small-bold" text-anchor="middle">DISTRIBUTED</text>
  <text x="286" y="687" class="small" text-anchor="middle">multiple gold pages</text>

  <rect x="56" y="727" width="346" height="130" rx="2" fill="#E9E4D9"/>
  <text x="76" y="758" class="body-bold">100-question benchmark</text>
  <text x="76" y="784" class="body">95 with annotated source pages</text>
  <text x="76" y="813" class="body">Page-level F-beta, beta = 2.5</text>
  <text x="76" y="839" class="small">Recall-weighted · eligible questions only</text>

  <line x1="56" y1="890" x2="402" y2="890" stroke="#CAC5BB" stroke-width="2"/>
  <text x="56" y="920" class="small-bold">STUDY STATUS</text>
  <text x="56" y="946" class="body">
    <tspan x="56" dy="0">Exploratory retrospective slice analysis</tspan>
    <tspan x="56" dy="24">of one saved development run.</tspan>
  </text>

  <!-- Methodology strip -->
  <text x="442" y="237" class="section">2  METHODOLOGY</text>
  <text x="1626" y="237" class="small" text-anchor="end">30 public DIFC legal PDFs · 590 pages</text>
  <line x1="442" y1="251" x2="1626" y2="251" stroke="#B58A3A" stroke-width="3"/>

  <line x1="500" y1="316" x2="1550" y2="316" stroke="#9C998F" stroke-width="2.5" stroke-dasharray="7 9" marker-end="url(#arrowStone)"/>
  <g filter="url(#soft)">
    <circle cx="500" cy="316" r="25" fill="#F3EFE6" stroke="#172234" stroke-width="3"/>
    <circle cx="710" cy="316" r="25" fill="#F3EFE6" stroke="#172234" stroke-width="3"/>
    <circle cx="920" cy="316" r="25" fill="#F3EFE6" stroke="#172234" stroke-width="3"/>
    <circle cx="1130" cy="316" r="25" fill="#F3EFE6" stroke="#172234" stroke-width="3"/>
    <circle cx="1340" cy="316" r="25" fill="#F3EFE6" stroke="#172234" stroke-width="3"/>
    <circle cx="1550" cy="316" r="25" fill="#F3EFE6" stroke="#172234" stroke-width="3"/>
  </g>
  <text x="500" y="322" class="small-bold" text-anchor="middle">01</text>
  <text x="710" y="322" class="small-bold" text-anchor="middle">02</text>
  <text x="920" y="322" class="small-bold" text-anchor="middle">03</text>
  <text x="1130" y="322" class="small-bold" text-anchor="middle">04</text>
  <text x="1340" y="322" class="small-bold" text-anchor="middle">05</text>
  <text x="1550" y="322" class="small-bold" text-anchor="middle">06</text>
  <text x="500" y="364" class="small-bold" text-anchor="middle">PDF pages</text>
  <text x="710" y="364" class="small-bold" text-anchor="middle">Page-stable</text>
  <text x="710" y="383" class="small" text-anchor="middle">multi-view index</text>
  <text x="920" y="364" class="small-bold" text-anchor="middle">BM25 + Qwen3</text>
  <text x="920" y="383" class="small" text-anchor="middle">embedding</text>
  <text x="1130" y="364" class="small-bold" text-anchor="middle">RRF + Qwen3</text>
  <text x="1130" y="383" class="small" text-anchor="middle">reranker</text>
  <text x="1340" y="364" class="small-bold" text-anchor="middle">Typed answer</text>
  <text x="1340" y="383" class="small" text-anchor="middle">GPT-5.4-mini</text>
  <text x="1550" y="364" class="small-bold" text-anchor="middle">Validated page</text>
  <text x="1550" y="383" class="small" text-anchor="middle">attribution</text>

  <rect x="442" y="408" width="1184" height="48" fill="#E9E4D9"/>
  <text x="464" y="439" class="body-bold">Invariant: every chunk retains document and page identity.</text>
  <text x="1606" y="439" class="small" text-anchor="end">59 vs 36 · 20,000 stratified bootstrap resamples · seed 20260903</text>

  <!-- Results hero -->
  <text x="442" y="505" class="section">3  RESULTS</text>
  <text x="638" y="505" class="sans" font-size="15" font-weight="600" fill="#686A69">ANSWER QUALITY STAYS CLOSE · PAGE GROUNDING SEPARATES</text>
  <line x1="442" y1="519" x2="1626" y2="519" stroke="#B58A3A" stroke-width="3"/>

  <!-- Main dot plot -->
  <text x="458" y="555" class="small-bold" letter-spacing="1">GROUP MEANS</text>
  <text x="1014" y="555" class="micro" text-anchor="end">COMMON 75–100% SCALE</text>
  <text x="458" y="602" class="body-bold">Answer quality</text>
  <line x1="680" y1="598" x2="1008" y2="598" stroke="#C8C3B9" stroke-width="3"/>
  <circle cx="954" cy="585" r="13" fill="#2F6F89"/>
  <text x="937" y="569" class="small-bold" text-anchor="end" fill="#2F6F89">Localized 95.9%</text>
  <path d="M935 598 l13 -13 l13 13 l-13 13 Z" fill="#B64A3E"/>
  <text x="921" y="628" class="small-bold" text-anchor="end" fill="#B64A3E">Distributed 94.4%</text>

  <text x="458" y="701" class="body-bold">Final page grounding</text>
  <line x1="680" y1="697" x2="1008" y2="697" stroke="#C8C3B9" stroke-width="3"/>
  <circle cx="927" cy="684" r="13" fill="#2F6F89"/>
  <text x="911" y="668" class="small-bold" text-anchor="end" fill="#2F6F89">Localized 93.8%</text>
  <path d="M767 697 l13 -13 l13 13 l-13 13 Z" fill="#B64A3E"/>
  <text x="767" y="728" class="small-bold" text-anchor="middle" fill="#B64A3E">Distributed 81.6%</text>

  <line x1="680" y1="755" x2="1008" y2="755" stroke="#77756F" stroke-width="2"/>
  <g class="small">
    <line x1="680" y1="750" x2="680" y2="762" stroke="#77756F"/><text x="680" y="783" text-anchor="middle">75</text>
    <line x1="746" y1="750" x2="746" y2="762" stroke="#77756F"/><text x="746" y="783" text-anchor="middle">80</text>
    <line x1="811" y1="750" x2="811" y2="762" stroke="#77756F"/><text x="811" y="783" text-anchor="middle">85</text>
    <line x1="877" y1="750" x2="877" y2="762" stroke="#77756F"/><text x="877" y="783" text-anchor="middle">90</text>
    <line x1="942" y1="750" x2="942" y2="762" stroke="#77756F"/><text x="942" y="783" text-anchor="middle">95</text>
    <line x1="1008" y1="750" x2="1008" y2="762" stroke="#77756F"/><text x="1008" y="783" text-anchor="middle">100%</text>
  </g>

  <!-- Difference interval plot -->
  <line x1="1032" y1="548" x2="1032" y2="792" stroke="#D0CBC1" stroke-width="2"/>
  <text x="1054" y="555" class="small-bold" letter-spacing="1">DISTRIBUTED − LOCALIZED</text>
  <line x1="1060" y1="746" x2="1298" y2="746" stroke="#77756F" stroke-width="2"/>
  <line x1="1219" y1="572" x2="1219" y2="746" stroke="#77756F" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="1219" y="768" class="small" text-anchor="middle">0</text>
  <text x="1060" y="768" class="small" text-anchor="middle">−20</text>
  <text x="1298" y="768" class="small" text-anchor="middle">+10 pp</text>
  <text x="1054" y="600" class="small-bold">Answer</text>
  <line x1="1133" y1="623" x2="1272" y2="623" stroke="#B64A3E" stroke-width="4"/>
  <line x1="1133" y1="613" x2="1133" y2="633" stroke="#B64A3E" stroke-width="3"/>
  <line x1="1272" y1="613" x2="1272" y2="633" stroke="#B64A3E" stroke-width="3"/>
  <path d="M1207 623 l10 -10 l10 10 l-10 10 Z" fill="#B64A3E"/>
  <text x="1054" y="652" class="small">−1.5 pp · 95% CI −10.8 to +6.7</text>
  <text x="1054" y="692" class="small-bold">Grounding</text>
  <line x1="1068" y1="715" x2="1172" y2="715" stroke="#B64A3E" stroke-width="4"/>
  <line x1="1068" y1="705" x2="1068" y2="725" stroke="#B64A3E" stroke-width="3"/>
  <line x1="1172" y1="705" x2="1172" y2="725" stroke="#B64A3E" stroke-width="3"/>
  <path d="M1122 715 l10 -10 l10 10 l-10 10 Z" fill="#B64A3E"/>
  <text x="1054" y="793" class="small">−12.2 pp · 95% CI −19.0 to −5.9</text>

  <!-- Raw-to-final diagnostic -->
  <line x1="1322" y1="548" x2="1322" y2="884" stroke="#D0CBC1" stroke-width="2"/>
  <text x="1344" y="555" class="small-bold" letter-spacing="1">RAW → FINAL</text>
  <text x="1360" y="589" class="small" text-anchor="middle">RAW</text>
  <text x="1574" y="589" class="small" text-anchor="middle">FINAL</text>
  <line x1="1360" y1="638" x2="1574" y2="596" stroke="#2F6F89" stroke-width="6"/>
  <circle cx="1360" cy="638" r="12" fill="#2F6F89"/>
  <circle cx="1574" cy="596" r="12" fill="#2F6F89"/>
  <text x="1344" y="628" class="small-bold" text-anchor="end" fill="#2F6F89">89.8</text>
  <text x="1592" y="602" class="small-bold" fill="#2F6F89">93.8</text>
  <text x="1467" y="600" class="body-bold" text-anchor="middle" fill="#2F6F89">+4.0 pp</text>
  <line x1="1360" y1="702" x2="1574" y2="738" stroke="#B64A3E" stroke-width="6"/>
  <path d="M1360 690 l12 12 l-12 12 l-12 -12 Z" fill="#B64A3E"/>
  <path d="M1574 726 l12 12 l-12 12 l-12 -12 Z" fill="#B64A3E"/>
  <text x="1344" y="708" class="small-bold" text-anchor="end" fill="#B64A3E">84.2</text>
  <text x="1592" y="744" class="small-bold" fill="#B64A3E">81.6</text>
  <text x="1467" y="746" class="body-bold" text-anchor="middle" fill="#B64A3E">−2.6 pp</text>
  <text x="1344" y="797" class="body-bold">
    <tspan x="1344" dy="0">Citation narrowing moves</tspan>
    <tspan x="1344" dy="24">the groups in opposite directions.</tspan>
  </text>
  <text x="1344" y="855" class="small">
    <tspan x="1344" dy="0">Within-run diagnostic;</tspan>
    <tspan x="1344" dy="20">not a causal ablation.</tspan>
  </text>

  <!-- Perfect-answer mismatch strips -->
  <rect x="442" y="819" width="856" height="117" fill="#E9E4D9"/>
  <text x="462" y="850" class="body-bold">Perfect answer, grounding &lt; 0.8</text>
  <text x="462" y="883" class="small-bold">LOCALIZED</text>
  <line x1="570" y1="878" x2="830" y2="878" stroke="#C8C3B9" stroke-width="12" stroke-linecap="round"/>
  <line x1="570" y1="878" x2="589" y2="878" stroke="#2F6F89" stroke-width="12" stroke-linecap="round"/>
  <circle cx="589" cy="878" r="8" fill="#2F6F89"/>
  <text x="853" y="884" class="body-bold" fill="#2F6F89">4 / 55 · 7.3%</text>
  <text x="462" y="917" class="small-bold">DISTRIBUTED</text>
  <line x1="570" y1="912" x2="830" y2="912" stroke="#C8C3B9" stroke-width="12" stroke-linecap="round"/>
  <line x1="570" y1="912" x2="692" y2="912" stroke="#B64A3E" stroke-width="12" stroke-linecap="round"/>
  <path d="M692 903 l9 9 l-9 9 l-9 -9 Z" fill="#B64A3E"/>
  <text x="853" y="918" class="body-bold" fill="#B64A3E">16 / 34 · 47.1%</text>

  <!-- Footer / decision -->
  <line x1="56" y1="990" x2="1626" y2="990" stroke="#172234" stroke-width="2"/>
  <text x="56" y="1024" class="eyebrow">DECISION</text>
  <text x="56" y="1063" class="title" font-size="30">Preserve evidence when support is spread.</text>
  <text x="56" y="1094" class="body">
    <tspan x="56" dy="0">Route citation policy using observable evidence spread or claim-level checks:</tspan>
    <tspan x="56" dy="25">narrow localized support; aggregate distributed support conservatively.</tspan>
  </text>
  <text x="56" y="1152" class="small-bold">Observed association consistent with H1 · not a causal claim</text>

  <line x1="670" y1="1010" x2="670" y2="1160" stroke="#C8C3B9" stroke-width="2"/>
  <text x="698" y="1024" class="eyebrow">LIMITATIONS</text>
  <text x="698" y="1057" class="foot">
    <tspan x="698" dy="0">• Single saved run; retrospective hypothesis.</tspan>
    <tspan x="698" dy="23">• Observational; page and document shape are confounded</tspan>
    <tspan x="716" dy="21">(35/36 multi-page questions are multi-document).</tspan>
    <tspan x="698" dy="23">• Heterogeneous scoring; uneven answer-type composition.</tspan>
    <tspan x="698" dy="23">• Limited external validity: one DIFC warm-up benchmark.</tspan>
  </text>

  <line x1="1210" y1="1010" x2="1210" y2="1160" stroke="#C8C3B9" stroke-width="2"/>
  <text x="1238" y="1024" class="eyebrow">REPRODUCIBILITY + REFERENCES</text>
  <text x="1238" y="1054" class="small-bold">github.com/SteinVR/Agentic-RAG-Challenge</text>
  <text x="1238" y="1077" class="micro">Run: submission_e2e_20260424_solver_narrowing_no_guard</text>
  <text x="1238" y="1106" class="micro">Lewis et al. (2020) · Cormack et al. (2009)</text>
  <text x="1238" y="1127" class="micro">Gao et al. (2023) · Zhang et al. (2025)</text>
  <text x="1238" y="1152" class="small-bold">Complete references + integrity declaration: appendix</text>
</svg>
